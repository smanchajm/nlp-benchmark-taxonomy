<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunburst des tâches (single_task_benchmark_paper)</title>
    <script src="./vendor/d3.v7.min.js"></script>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .layout {
        max-width: 1280px;
        margin: 0 auto;
        padding: 20px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .header h1 {
        font-size: 22px;
        margin: 0;
      }
      .meta {
        color: #475569;
        font-size: 14px;
      }
      .panel {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 10px;
      }
      #chart {
        width: 100%;
        min-height: 760px;
      }
      .legend {
        margin-top: 8px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 8px 16px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #334155;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 1px solid #cbd5e1;
        flex-shrink: 0;
      }
      .hint {
        margin-top: 8px;
        color: #64748b;
        font-size: 12px;
      }
      .error {
        color: #b91c1c;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="layout">
      <section class="header">
        <div>
          <h1>Sunburst des tâches NLP</h1>
          <div class="meta" id="metaLine">Chargement...</div>
        </div>
      </section>
      <section class="panel">
        <div id="chart"></div>
        <div class="legend" id="legend"></div>
        <div class="hint">
          Clic sur un segment parent pour zoomer. Clic au centre pour dézoomer.
        </div>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        const DATA_PATH = "./task_sunburst_data.json";
        const chartEl = document.getElementById("chart");
        const legendEl = document.getElementById("legend");
        const metaEl = document.getElementById("metaLine");

        function truncate(text, max) {
          const value = String(text || "");
          return value.length <= max ? value : `${value.slice(0, max - 1)}…`;
        }

        function render(rootData) {
          chartEl.innerHTML = "";
          legendEl.innerHTML = "";

          const width = Math.max(960, chartEl.clientWidth || 0);
          const height = 860;
          const radius = Math.min(width, height) / 6;

          const root = d3
            .hierarchy(rootData)
            // Count only leaf nodes to avoid double-counting internal totals.
            .sum((d) => (d.children && d.children.length ? 0 : Number(d.value || 0)))
            .sort((a, b) => b.value - a.value);

          d3.partition().size([2 * Math.PI, root.height + 1])(root);
          root.each((d) => (d.current = d));

          const topLabels = (root.children || []).map((d) => d.data.label);
          const color = d3
            .scaleOrdinal()
            .domain(topLabels)
            .range(d3.quantize(d3.interpolateRainbow, Math.max(10, topLabels.length + 1)));

          const totalPapers = Number(rootData.paper_count || root.value || 0);
          metaEl.textContent = `${totalPapers.toLocaleString("fr-CA")} papiers uniques, ${
            topLabels.length
          } mother tasks`;

          const svg = d3
            .select(chartEl)
            .append("svg")
            .attr("viewBox", [-width / 2, -height / 2, width, height])
            .attr("width", "100%")
            .attr("height", height)
            .style("font", "12px Inter, Arial, sans-serif");

          const g = svg.append("g");

          const arc = d3
            .arc()
            .startAngle((d) => d.x0)
            .endAngle((d) => d.x1)
            .padAngle((d) => Math.min((d.x1 - d.x0) / 2, 0.005))
            .padRadius(radius * 1.5)
            .innerRadius((d) => d.y0 * radius)
            .outerRadius((d) => Math.max(d.y0 * radius, d.y1 * radius - 1));

          const path = g
            .append("g")
            .selectAll("path")
            .data(root.descendants().slice(1))
            .join("path")
            .attr("fill", (d) => {
              if (d.data.is_direct) {
                return "#94a3b8";
              }
              let node = d;
              while (node.depth > 1) node = node.parent;
              return color(node.data.label);
            })
            .attr("fill-opacity", (d) => (arcVisible(d.current) ? (d.children ? 0.75 : 0.55) : 0))
            .attr("pointer-events", (d) => (arcVisible(d.current) ? "auto" : "none"))
            .attr("d", (d) => arc(d.current));

          path.filter((d) => d.children).style("cursor", "pointer").on("click", clicked);

          path
            .append("title")
            .text(
              (d) =>
                `${d.data.label}\nPapiers: ${Math.round(d.value || 0)}${
                  d.data.is_direct ? "\n(assignations directes)" : ""
                }`,
            );

          const label = g
            .append("g")
            .attr("pointer-events", "none")
            .attr("text-anchor", "middle")
            .style("user-select", "none")
            .selectAll("text")
            .data(root.descendants().slice(1))
            .join("text")
            .attr("dy", "0.35em")
            .attr("fill-opacity", (d) => +labelVisible(d.current))
            .attr("transform", (d) => labelTransform(d.current))
            .text((d) => truncate(`${d.data.label} (${Math.round(d.value || 0)})`, 30));

          const parent = g
            .append("circle")
            .datum(root)
            .attr("r", radius)
            .attr("fill", "none")
            .attr("pointer-events", "all")
            .style("cursor", "pointer")
            .on("click", clicked);

          g
            .append("text")
            .attr("text-anchor", "middle")
            .attr("dy", "-0.1em")
            .style("font-size", "14px")
            .style("font-weight", "600")
            .style("fill", "#0f172a")
            .text("Zoom out");

          g
            .append("text")
            .attr("text-anchor", "middle")
            .attr("dy", "1.2em")
            .style("font-size", "12px")
            .style("fill", "#64748b")
            .text("racine");

          function arcVisible(d) {
            return d.y1 <= 3 && d.y0 >= 1 && d.x1 > d.x0;
          }

          function labelVisible(d) {
            return d.y1 <= 3 && d.y0 >= 1 && (d.x1 - d.x0) * (d.y1 - d.y0) > 0.04;
          }

          function labelTransform(d) {
            const x = ((d.x0 + d.x1) / 2) * (180 / Math.PI);
            const y = ((d.y0 + d.y1) / 2) * radius;
            return `rotate(${x - 90}) translate(${y},0) rotate(${x < 180 ? 0 : 180})`;
          }

          function clicked(_, p) {
            parent.datum(p.parent || root);
            root.each((d) => {
              d.target = {
                x0: Math.max(0, Math.min(1, (d.x0 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
                x1: Math.max(0, Math.min(1, (d.x1 - p.x0) / (p.x1 - p.x0))) * 2 * Math.PI,
                y0: Math.max(0, d.y0 - p.depth),
                y1: Math.max(0, d.y1 - p.depth),
              };
            });

            const t = g.transition().duration(650);
            path
              .transition(t)
              .tween("data", (d) => {
                const i = d3.interpolate(d.current, d.target);
                return (tt) => {
                  d.current = i(tt);
                };
              })
              .filter(function (d) {
                return +this.getAttribute("fill-opacity") || arcVisible(d.target);
              })
              .attr("fill-opacity", (d) => (arcVisible(d.target) ? (d.children ? 0.75 : 0.55) : 0))
              .attr("pointer-events", (d) => (arcVisible(d.target) ? "auto" : "none"))
              .attrTween("d", (d) => () => arc(d.current));

            label
              .filter(function (d) {
                return +this.getAttribute("fill-opacity") || labelVisible(d.target);
              })
              .transition(t)
              .attr("fill-opacity", (d) => +labelVisible(d.target))
              .attrTween("transform", (d) => () => labelTransform(d.current));
          }

          for (const node of rootData.children || []) {
            const item = document.createElement("div");
            item.className = "legend-item";
            const paperCount = Number(node.paper_count || node.value || 0);
            item.innerHTML = `<span class="dot" style="background:${color(
              node.label,
            )}"></span><span>${node.label} (${paperCount.toLocaleString("fr-CA")})</span>`;
            legendEl.appendChild(item);
          }
        }

        async function bootstrap() {
          try {
            const response = await fetch(DATA_PATH);
            if (!response.ok) {
              throw new Error(`Impossible de charger ${DATA_PATH} (HTTP ${response.status})`);
            }
            const data = await response.json();
            render(data);
          } catch (error) {
            metaEl.textContent = "Erreur de chargement";
            chartEl.innerHTML = `<div class="error">${error.message}</div>`;
          }
        }

        bootstrap();
      })();
    </script>
  </body>
</html>
